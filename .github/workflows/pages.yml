name: Deploy static PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Check GitHub Pages configuration
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Pages is not enabled yet
        if: steps.pages.outcome == 'failure'
        run: echo "::warning::Tests passed, but GitHub Pages is not enabled. Open Settings > Pages, select GitHub Actions, then rerun this workflow."
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
