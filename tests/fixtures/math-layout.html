<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>数芽界面回归样例 · 演示数据</title>
  <link rel="stylesheet" href="../../vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="../../styles.css" />
  <style>
    body { padding: 16px; }
    main { max-width: 980px; margin: auto; }
    h1 { margin: 18px 0 12px; font-size: 28px; }
    .preview-note { margin: 10px 0; color: #526b66; }
    .chat-log { min-height: 0; height: auto; }
    iframe { display: block; width: 375px; max-width: 100%; height: 1000px; border: 1px solid #ccd5d0; }
  </style>
</head>
<body>
<main>
  <p class="preview-note">界面回归样例 · 以下均为演示数据，不连接模型、不保存学习记录</p>
  <section class="card parent-banner">
    <div><h2>学员A · 学校A</h2><p>六年级上 · 沪教版（请按学校教材校准）</p></div>
    <div class="button-row"><button class="button secondary small">学习设置</button><button class="button secondary small">学生档案</button></div>
  </section>
  <h1>分数大小比较</h1>
  <section class="card">
    <div class="chat-log">
      <div class="message assistant">
        <span class="message-avatar">芽</span>
        <div class="message-bubble"><p>先热个身：不用算，只看这两个分数，你觉得哪个大？说说你的理由。</p><div class="math-block" id="fraction"></div></div>
      </div>
      <div class="message assistant"><span class="message-avatar">芽</span><div class="message-bubble"><p id="root"></p></div></div>
      <div class="message assistant"><span class="message-avatar">芽</span><div class="message-bubble"><p>长公式可以横向查看：</p><div class="math-block" id="long"></div></div></div>
      <div class="ai-error"><strong>本轮回复未完成</strong><span>模型回复被截断，你的作答已保留，请重试本轮。</span><button class="button secondary small">重试本轮</button></div>
    </div>
    <div class="composer">
      <div class="composer-main"><textarea aria-label="写答案" placeholder="写答案、说思路，或直接问哪里没听懂……"></textarea><button class="button primary">发送</button></div>
      <div class="ai-suggestion-row" id="suggestions"></div>
    </div>
  </section>
  <section id="mobile-preview" hidden><h1>375px 手机宽度</h1><iframe title="手机布局样例"></iframe></section>
</main>
<script type="module" src="./math-layout.js"></script>
</body>
</html>
