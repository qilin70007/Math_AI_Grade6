<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#184f4a" />
    <meta name="description" content="给上海六年级学生使用的数学 AI 私教：今日任务、互动课堂、错题复习、知识地图与家长看板。" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>数芽 · 六年级数学 AI 私教</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-rail" aria-label="主要导航">
        <a class="brand" href="#today" aria-label="数芽首页">
          <span class="brand-mark" aria-hidden="true">芽</span>
          <span class="brand-copy"><strong>数芽</strong><small>六年级数学 AI 私教</small></span>
        </a>
        <nav class="rail-nav" id="desktop-nav"></nav>
        <div class="rail-note">
          <span class="soft-dot"></span>
          <div><strong>数据仅存本机</strong><small>家长可随时备份或恢复</small></div>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <a class="mobile-brand" href="#today"><span>芽</span><strong>数芽</strong></a>
          <div class="topbar-copy">
            <p id="greeting">下午好，学员A</p>
            <span id="date-label"></span>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" id="install-button" type="button" title="安装到设备" hidden aria-label="安装应用">↓</button>
            <button class="profile-chip" id="profile-button" type="button" aria-label="查看学生档案">
              <span class="avatar">A</span>
              <span class="profile-name">六年级</span>
            </button>
          </div>
        </header>

        <main id="app" tabindex="-1"></main>
      </div>

      <nav class="bottom-nav" id="mobile-nav" aria-label="主要导航"></nav>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="modal-root"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
